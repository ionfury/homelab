---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Infrastructure Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Path filtering. Runs on every PR so the gate always reports a status.
  changes:
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            infrastructure:
              - 'infrastructure/**'
              - '.github/workflows/infrastructure-validate.yaml'
              - '.mise.toml'

  format:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive -diff infrastructure/

      - name: Check Terragrunt formatting
        working-directory: infrastructure
        run: terragrunt hcl format --check

  test:
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [aws-set-params, bootstrap, config, talos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Initialize module
        working-directory: infrastructure/modules/${{ matrix.module }}
        run: tofu init -upgrade

      - name: Run tests
        working-directory: infrastructure/modules/${{ matrix.module }}
        run: tofu test

  # Gate: the single required status check. Matrix contexts are dynamic, so
  # branch protection tracks this aggregate instead of individual job names.
  infrastructure-validate:
    if: always()
    needs: [changes, format, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: format,test
