---
# https://raw.githubusercontent.com/longhorn/charts/master/charts/longhorn/values.yaml
longhornManager:
  priorityClass: infrastructure-critical
longhornDriver:
  priorityClass: infrastructure-critical
longhornUI:
  priorityClass: infrastructure-critical
longhornAdmissionWebhook:
  priorityClass: infrastructure-critical
longhornRecoveryBackend:
  priorityClass: infrastructure-critical
longhornConversionWebhook:
  priorityClass: infrastructure-critical
persistence:
  defaultFsType: xfs
  defaultClassReplicaCount: ${default_replica_count}
defaultSettings:
  defaultReplicaCount: ${default_replica_count}
  replicaAutoBalance: best-effort
  createDefaultDiskLabeledNodes: true
  storageReservedPercentageForDefaultDisk: 10
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Wait for a rebooted node to rejoin before replenishing its replicas. Talos
  # upgrades take a node offline longer than the 600s default, causing Longhorn
  # to full-rebuild multi-Ti replicas every upgrade. 1800s covers a single-node
  # upgrade so the node returns and Longhorn does a fast delta rebuild instead.
  replicaReplenishmentWaitInterval: 1800
  storageOverProvisioningPercentage: 500
  storageMinimalAvailablePercentage: 10
  autoCleanupSystemGeneratedSnapshot: true
  snapshotMaxCount: 3
  longGRPCTimeOut: 345600
csi:
  attacherReplicaCount: ${default_replica_count}
  provisionerReplicaCount: ${default_replica_count}
  resizerReplicaCount: ${default_replica_count}
  snapshotterReplicaCount: ${default_replica_count}
metrics:
  serviceMonitor:
    enabled: true
