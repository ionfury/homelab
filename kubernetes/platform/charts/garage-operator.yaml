---
priorityClassName: platform
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 1Gi

metrics:
  enabled: true

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true

# Alert rules live in config/garage/prometheus-rules.yaml; operator-generated
# rules duplicate them and double-page on garage incidents
prometheusRules:
  enabled: false
