---
replicaCount: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: garage-operator
        app.kubernetes.io/instance: garage-operator
        control-plane: controller-manager

priorityClassName: platform
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 1Gi

metrics:
  enabled: true

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true

# Alert rules live in config/garage/prometheus-rules.yaml; operator-generated
# rules duplicate them and double-page on garage incidents
prometheusRules:
  enabled: false
