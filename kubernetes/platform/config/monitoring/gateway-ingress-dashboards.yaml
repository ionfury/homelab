---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gateway-ingress-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: Network
data:
  gateway-ingress-overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "title": "Detail \u2192",
          "type": "link",
          "url": "/d/gateway-ingress-detail",
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false,
          "tags": []
        }
      ],
      "panels": [
        {
          "type": "row",
          "collapsed": false,
          "title": "Golden Signals",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "Request Rate",
          "description": "Total ingress request rate through the selected gateway.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Success Rate",
          "description": "Percent non-5xx. Below SLO fires GatewayAvailabilityBudgetBurning*.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code!~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\"}[$__rate_interval])), 1e-9)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              },
              "unit": "percent",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "5xx Error Rate",
          "description": "Percent of 5xx responses. Drives availability error budget.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\"}[$__rate_interval])), 1e-9)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "percent",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "4xx Error Rate",
          "description": "Percent of 4xx (client/auth). Context, not an SLO breach.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"4..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\"}[$__rate_interval])), 1e-9)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 20
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "unit": "percent",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "p95 Latency",
          "description": "95th percentile duration. Above per-app SLO fires GatewayLatencyBudgetBurning*.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\"}[$__rate_interval])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 2500
                  }
                ]
              },
              "unit": "ms",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "p99 Latency",
          "description": "99th percentile (tail). Sustained spikes = saturation or upstream stalls.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\"}[$__rate_interval])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 2500
                  },
                  {
                    "color": "red",
                    "value": 5000
                  }
                ]
              },
              "unit": "ms",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "type": "row",
          "collapsed": false,
          "title": "Traffic Over Time",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "Requests by Response Class",
          "description": "Stacked request rate by HTTP status class over the window. Rising red (5xx) = availability signal; the pulse of the gateway.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\",response_code=~\"2..\"}[$__rate_interval]))",
              "legendFormat": "2xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\",response_code=~\"3..\"}[$__rate_interval]))",
              "legendFormat": "3xx",
              "refId": "B"
            },
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\",response_code=~\"4..\"}[$__rate_interval]))",
              "legendFormat": "4xx",
              "refId": "C"
            },
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\",response_code=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "5xx",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisLabel": "",
                "drawStyle": "bars",
                "barAlignment": 0,
                "fillOpacity": 90,
                "gradientMode": "none",
                "lineWidth": 0,
                "pointSize": 5,
                "showPoints": "never",
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "unit": "reqps",
              "decimals": 3
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "collapsed": false,
          "title": "Traffic Origin & Share",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 10
        },
        {
          "type": "geomap",
          "title": "Client Origin (external)",
          "description": "Geo origin of external ingress clients from Alloy geoip-enriched access logs. Heat layer = density, markers = individual clients. Populated once the geo pipeline is deployed; empty for the internal gateway.",
          "gridPos": {
            "h": 16,
            "w": 16,
            "x": 0,
            "y": 16
          },
          "id": 11,
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "queryType": "range",
              "editorMode": "code",
              "expr": "{namespace=\"istio-gateway\", gateway=\"external\"} | geoip_lat != \"\""
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "labels",
                "keepLabels": true
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "geoip_lat",
                    "destinationType": "number"
                  },
                  {
                    "targetField": "geoip_lon",
                    "destinationType": "number"
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "view": {
              "id": "zero",
              "lat": 25,
              "lon": 0,
              "zoom": 1.6
            },
            "basemap": {
              "type": "default",
              "name": "Basemap"
            },
            "controls": {
              "showZoom": true,
              "mouseWheelZoom": true,
              "showAttribution": true,
              "showScale": false,
              "showMeasure": false,
              "showDebug": false
            },
            "layers": [
              {
                "type": "heatmap",
                "name": "Density",
                "location": {
                  "mode": "coords",
                  "latitude": "geoip_lat",
                  "longitude": "geoip_lon"
                },
                "config": {
                  "weight": {
                    "fixed": 1,
                    "min": 0,
                    "max": 1
                  },
                  "radius": 18,
                  "blur": 22,
                  "opacity": 0.5
                }
              },
              {
                "type": "markers",
                "name": "Clients",
                "location": {
                  "mode": "coords",
                  "latitude": "geoip_lat",
                  "longitude": "geoip_lon"
                },
                "config": {
                  "showLegend": true,
                  "style": {
                    "size": {
                      "fixed": 6
                    },
                    "color": {
                      "fixed": "orange"
                    },
                    "opacity": 0.8,
                    "symbol": {
                      "fixed": "img/icons/marker/circle.svg",
                      "mode": "fixed"
                    }
                  }
                },
                "tooltip": true
              }
            ]
          }
        },
        {
          "type": "piechart",
          "title": "Traffic Share by Endpoint",
          "description": "Request-rate distribution across upstream apps for the selected gateway (fan-out map).",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\",destination_workload=~\"$endpoint\",response_code=~\"$code\"}[$__range])) by (destination_workload)",
              "legendFormat": "{{destination_workload}}",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          }
        },
        {
          "type": "table",
          "title": "Top Countries (external)",
          "description": "Request count by client country from enriched access logs. Populated post-deploy.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 24
          },
          "id": 13,
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "queryType": "instant",
              "editorMode": "code",
              "expr": "sum by (geoip_country_code) (count_over_time({namespace=\"istio-gateway\", gateway=\"external\"} | json | geoip_country_code != \"\" [$__range]))"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "geoip_country_code": "Country",
                  "Value": "Requests"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Requests",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Requests"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-GrYlRd"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "istio",
        "gateway",
        "ingress",
        "network"
      ],
      "templating": {
        "list": [
          {
            "name": "gateway",
            "label": "Gateway",
            "type": "custom",
            "query": "Internal : internal-istio, External : external-istio",
            "current": {
              "text": "External",
              "value": "external-istio"
            },
            "options": [
              {
                "text": "Internal",
                "value": "internal-istio",
                "selected": false
              },
              {
                "text": "External",
                "value": "external-istio",
                "selected": true
              }
            ],
            "includeAll": false,
            "multi": false
          },
          {
            "name": "endpoint",
            "label": "Endpoint",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"source\",source_workload=\"$gateway\"}, destination_workload)",
              "refId": "endpoint"
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "code",
            "label": "Response Class",
            "type": "custom",
            "query": "2xx : 2.., 3xx : 3.., 4xx : 4.., 5xx : 5..",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": [
              {
                "text": "2xx",
                "value": "2..",
                "selected": false
              },
              {
                "text": "3xx",
                "value": "3..",
                "selected": false
              },
              {
                "text": "4xx",
                "value": "4..",
                "selected": false
              },
              {
                "text": "5xx",
                "value": "5..",
                "selected": false
              }
            ]
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Ingress Gateway Overview",
      "uid": "gateway-ingress-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gateway-ingress-detail
  namespace: monitoring
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: Network
data:
  gateway-ingress-detail.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "title": "\u2190 Overview",
