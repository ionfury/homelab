---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/values.schema.json
# https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
controllers:
  valheim:
    type: statefulset
    replicas: 1

    pod:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    containers:
      app:
        image:
          repository: ghcr.io/community-valheim-tools/valheim-server
          tag: "${valheim_version}"
        env:
          # Server configuration
          SERVER_NAME: "Valheim Dedicated"
          SERVER_PUBLIC: "0"
          WORLD_NAME: "Dedicated"
          # Credentials — auto-generated by secret-generator
          SERVER_PASS:
            valueFrom:
              secretKeyRef:
                name: valheim-server-password
                key: password
          # Container user mapping (drops root privileges internally)
          PUID: "1000"
          PGID: "1000"
          # Health check endpoint
          STATUS_HTTP: "true"
          STATUS_HTTP_PORT: "8080"
          # Built-in backup configuration
          BACKUPS: "true"
          BACKUPS_DIRECTORY: /config/backups
          BACKUPS_MAX_AGE: "7"
          BACKUPS_MAX_COUNT: "10"
          BACKUPS_IF_IDLE: "true"
          BACKUPS_IDLE_GRACE_PERIOD: "3600"
          DISCORD_WEBHOOK:
            valueFrom:
              secretKeyRef:
                name: valheim-discord-webhook
                key: url
          POST_SERVER_LISTENING_HOOK: "python3 /scripts/notify.py online"
          PRE_SERVER_SHUTDOWN_HOOK: "python3 /scripts/notify.py shutdown"
          PRE_RESTART_HOOK: "python3 /scripts/notify.py restart"
          VALHEIM_LOG_FILTER_CONTAINS_Player: "Got character ZDOID from"
          ON_VALHEIM_LOG_FILTER_CONTAINS_Player: "python3 /scripts/notify.py player"
          VALHEIM_LOG_FILTER_CONTAINS_Connect: "Got connection SteamID"
          ON_VALHEIM_LOG_FILTER_CONTAINS_Connect: "python3 /scripts/notify.py connect"
          VALHEIM_LOG_FILTER_CONTAINS_Disconnect: "Closing socket"
          ON_VALHEIM_LOG_FILTER_CONTAINS_Disconnect: "python3 /scripts/notify.py disconnect"
        resources:
          requests:
            cpu: "4"
            memory: 6Gi
          limits:
            memory: 32Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.json
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 90
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.json
                port: 8080
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.json
                port: 8080
              periodSeconds: 10

service:
  game:
    controller: valheim
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: ${valheim_ip}
    ports:
      gameplay:
        port: 2456
        protocol: UDP
      query:
        port: 2457
        protocol: UDP

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: fast
    advancedMounts:
      valheim:
        app:
          - path: /config
  notify:
    type: configMap
    name: valheim-notify
    advancedMounts:
      valheim:
        app:
          - path: /scripts/notify.py
            subPath: notify.py
            readOnly: true
