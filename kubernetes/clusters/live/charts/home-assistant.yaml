---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/values.schema.json
# https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
controllers:
  home-assistant:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    initContainers:
      install-oidc-component:
        image:
          repository: alpine
          # renovate: datasource=docker depName=alpine
          tag: "3.24.1"
        command:
          - sh
          - -c
          - |
            set -eu
            if [ -f /config/custom_components/auth_oidc/.version ] && [ "$(cat /config/custom_components/auth_oidc/.version)" = "${hass_oidc_auth_version}" ]; then
              echo "auth_oidc ${hass_oidc_auth_version} already installed, skipping"
              exit 0
            fi
            echo "Installing hass-oidc-auth ${hass_oidc_auth_version}..."
            rm -rf /config/custom_components/auth_oidc
            wget -qO /tmp/oidc.tar.gz "https://github.com/christiaangoossens/hass-oidc-auth/archive/refs/tags/${hass_oidc_auth_version}.tar.gz"
            mkdir -p /config/custom_components
            tar -xzf /tmp/oidc.tar.gz -C /tmp
            cp -r /tmp/hass-oidc-auth-*/custom_components/auth_oidc /config/custom_components/auth_oidc
            echo "${hass_oidc_auth_version}" > /config/custom_components/auth_oidc/.version
            echo "auth_oidc ${hass_oidc_auth_version} installed"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: "${home_assistant_version}"
        env:
          HASS_RECORDER_DB_URL:
            valueFrom:
              secretKeyRef:
                name: hass-db-credentials
                key: uri
          HASS_OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: home-assistant-oidc-client-secret
                key: client-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /manifest.json
                port: 8123
              initialDelaySeconds: 90
              periodSeconds: 10
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /manifest.json
                port: 8123
              initialDelaySeconds: 90
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /manifest.json
                port: 8123
              initialDelaySeconds: 90
              periodSeconds: 10
              failureThreshold: 3

service:
  app:
    controller: home-assistant
    ports:
      http:
        port: 8123

serviceMonitor:
  app:
    serviceName: home-assistant-app
    endpoints:
      - port: http
        interval: 60s
        scrapeTimeout: 30s
        path: /api/prometheus
        bearerTokenSecret:
          name: hass-prometheus-token
          key: token

route:
  internal:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Home Assistant"
      gethomepage.dev/group: "Home"
      gethomepage.dev/icon: "home-assistant.svg"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=home-assistant"
    parentRefs:
      - name: internal
        namespace: istio-gateway
    hostnames:
      - "hass.${internal_domain}"
    rules:
      - backendRefs:
          - identifier: app
            port: 8123

persistence:
  config:
    existingClaim: hass-config
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  hass-config-yaml:
    type: configMap
    name: hass-config
    globalMounts:
      - path: /config/configuration.yaml
        subPath: configuration.yaml
        readOnly: true
