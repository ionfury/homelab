---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure workers to reach the SimpleFIN bridge for bank transaction sync.
# All other internet egress is blocked by the namespace's internal profile.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-simplefin-egress
  namespace: sure
spec:
  description: "Allow Sure egress to SimpleFIN API (beta-bridge.simplefin.org:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: beta-bridge.simplefin.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure to reach the SnapTrade API for brokerage account OAuth and data sync.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-snaptrade-egress
  namespace: sure
spec:
  description: "Allow Sure egress to SnapTrade API (api.snaptrade.com:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: api.snaptrade.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-to-ollama
  namespace: sure
spec:
  description: "Allow Sure egress to Ollama LLM API for chat assistant and auto-categorization"
  endpointSelector: { }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure to reach Twelve Data for securities price history (the enabled
# securities provider). Without a reachable provider, mutual/index-fund holdings
# have no price history, so investment balance charts collapse to $0 on all past
# dates and spike only on the latest sync day.
#
# Replaces the previous Yahoo Finance egress: Yahoo's unauthenticated API
# semi-permanently IP-rate-limits datacenter egress (persistent HTTP 429 from
# the cluster), making it unusable server-side. Twelve Data is a keyed API with
# no IP-reputation gating.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-twelvedata-egress
  namespace: sure
spec:
  description: "Allow Sure egress to Twelve Data API (api.twelvedata.com:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: api.twelvedata.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
