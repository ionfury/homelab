---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure workers to reach the SimpleFIN bridge for bank transaction sync.
# All other internet egress is blocked by the namespace's internal profile.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-simplefin-egress
  namespace: sure
spec:
  description: "Allow Sure egress to SimpleFIN API (beta-bridge.simplefin.org:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: beta-bridge.simplefin.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure to reach the SnapTrade API for brokerage account OAuth and data sync.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-snaptrade-egress
  namespace: sure
spec:
  description: "Allow Sure egress to SnapTrade API (api.snaptrade.com:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: api.snaptrade.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-to-ollama
  namespace: sure
spec:
  description: "Allow Sure egress to Ollama LLM API for chat assistant and auto-categorization"
  endpointSelector: { }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Permits Sure to reach Yahoo Finance for securities price history (the enabled
# securities provider). Without this, mutual/index-fund holdings have no price
# history, so investment balance charts collapse to $0 on all past dates and
# spike only on the latest sync day.
# - fc.yahoo.com: cookie fetch for crumb authentication
# - query1.finance.yahoo.com: data endpoints (getcrumb, search, quoteSummary, chart)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-yahoo-finance-egress
  namespace: sure
spec:
  description: "Allow Sure egress to Yahoo Finance API (fc.yahoo.com, query1.finance.yahoo.com:443)"
  endpointSelector: { }
  egress:
    - toFQDNs:
        - matchName: fc.yahoo.com
        - matchName: query1.finance.yahoo.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
