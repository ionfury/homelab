---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-assistant-alerts
  namespace: home-assistant
  labels:
    prometheus: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: home-assistant.availability
      rules:
        - alert: HomeAssistantDown
          expr: |
            kube_deployment_status_replicas_ready{namespace="home-assistant", deployment="home-assistant"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Home Assistant is down"
            description: "No Home Assistant pods are ready. Smart home automations are unavailable."

        - alert: HomeAssistantCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="home-assistant", container="app"}[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Home Assistant pod is crash-looping"
            description: "Home Assistant has restarted {{ $value | humanize }} times in the last 15 minutes."

    - name: home-assistant.storage
      rules:
        - alert: HomeAssistantConfigPVCNearFull
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="home-assistant", persistentvolumeclaim="hass-config"}
              / kubelet_volume_stats_capacity_bytes{namespace="home-assistant", persistentvolumeclaim="hass-config"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Home Assistant /config PVC is nearly full"
            description: "{{ $value | humanizePercentage }} of the hass-config PVC is used. Expand the PVC before it fills up."

    - name: home-assistant.database
      rules:
        - alert: HomeAssistantRecorderDBClusterNotHealthy
          expr: |
            cnpg_pg_replication_streaming{namespace="database", cluster="hass-database"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Home Assistant recorder database cluster is not healthy"
            description: "CNPG cluster hass-database has no streaming replication. Recorder data may be lost."
