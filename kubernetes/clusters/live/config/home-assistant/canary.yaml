---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/canaries.flanksource.com/canary_v1.json
apiVersion: canaries.flanksource.com/v1
kind: Canary
metadata:
  name: home-assistant-health
  namespace: home-assistant
spec:
  schedule: "@every 1m"
  http:
    - name: home-assistant-ui
      url: https://hass.${internal_domain}/manifest.json
      responseCodes: [200]
      maxSSLExpiry: 7
      thresholdMillis: 10000
