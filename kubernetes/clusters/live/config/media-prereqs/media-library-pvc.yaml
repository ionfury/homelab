---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: slow-media
  # Binds to the static PV above rather than provisioning a new volume.
  volumeName: media-library
  resources:
    requests:
      storage: 10Ti
