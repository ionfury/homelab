---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-discord-webhook
  namespace: valheim
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: valheim-discord-webhook
  data:
    - secretKey: url
      remoteRef:
        key: /homelab/kubernetes/${cluster_name}/valheim/discord-webhook
