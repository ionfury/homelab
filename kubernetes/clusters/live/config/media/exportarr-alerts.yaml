---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: exportarr-alerts
  namespace: media
  labels:
    prometheus: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: exportarr.rules
      rules:
        - alert: ArrApplicationUnreachable
          expr: |
            {__name__=~"(sonarr|radarr|prowlarr)_system_status"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "*arr application {{ $labels.job }} reports unhealthy status"
            description: "Exportarr reports that the *arr application behind {{ $labels.job }} is not healthy."
