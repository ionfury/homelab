---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Transitional: keep prune protection until the ownership transfer from
# cluster-config/cluster-resources has converged on live. Safe to remove
# afterwards; consider keeping it on the PVCs as permanent data protection.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
  fluxcd.controlplane.io/prune: disabled
resources:
  - namespace.yaml
  - data-pvc.yaml
  - media-pvc.yaml
  - paperless-db-credentials.yaml
  - dragonfly-password-replica.yaml
  - paperless-oidc-client-secret-replica.yaml
  - paperless-secret.yaml
  - canary.yaml
  - imap-egress.yaml
  - ollama-egress.yaml
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  # Per-app values ConfigMap consumed by the HelmRelease via valuesFrom. A
  # per-app ConfigMap (vs the legacy shared cluster-values) keeps blast radius
  # to one app and colocates values in the app folder. disableNameSuffixHash
  # keeps the name stable so the HelmRelease can reference it; helm-controller
  # watches it and re-renders on change. Lives in flux-system to match the
  # HelmRelease namespace (valuesFrom is same-namespace only).
  - name: paperless-values
    namespace: flux-system
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml
