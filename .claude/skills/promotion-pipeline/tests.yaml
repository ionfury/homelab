version: 1
skill: promotion-pipeline
description: "Verify the direct build-to-live OCI artifact pipeline is correctly described: full flow, tagging strategy, semver constraints, debugging procedures, and rollback."
tests:
  - id: PRM-01
    description: "Full pipeline flow from PR merge to live"
    category: coverage
    severity: critical
    prompt: |
      Walk me through the complete pipeline from when a PR is merged to main until the change reaches the live cluster. What are all the stages and what happens at each one?
    scoring:
      mode: both
      keywords:
        required:
          - build-platform-artifact
          - live
          - OCIRepository
        any_of:
          - X.Y.Z
          - stable
          - validated
          - canary
        forbidden:
          - tag-validated-artifact
          - repository_dispatch
          - rc.N
      judge_criteria: |
        Score 0-10 on completeness and correctness of the pipeline description.
        10: Covers the direct build-to-live flow: (1) GHA build triggered on merge to main when kubernetes/ changed, (2) build queries GHCR for highest stable tag and bumps patch, (3) OCI artifact pushed with stable X.Y.Z plus sha-<short> and validated-<short> tags and a GitHub Release is created, (4) live OCIRepository picks it up via semver >= 0.0.0 and Flux reconciles, (5) canary-checker provides a post-deploy health signal, not a gate. Does NOT describe an integration validation stage or a separate promotion workflow.
        7-9: Correct direct flow but missing one or two details (e.g. tag set, canary signal).
        4-6: Correct general direction but incomplete tagging/reconciliation details.
        1-3: Describes the old RC/integration-gated flow or misses multiple stages.
        0: Incorrect or no pipeline description.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Describes the direct build-to-live flow: build workflow tags the artifact as stable X.Y.Z (plus sha-<short> and validated-<short>) at build time and creates a GitHub Release; live picks up the stable tag via the >= 0.0.0 semver constraint. Notes there is no integration validation gate and canary-checker is a post-deploy signal only.
    tags:
      - promotion-pipeline-skill

  - id: PRM-02
    description: "Artifact tagging strategy — all tags applied at build time"
    category: coverage
    severity: critical
    prompt: |
      What tags does a platform OCI artifact receive, what creates each tag, and what is each used for?
    scoring:
      mode: both
      keywords:
        required:
          - sha-
          - validated-
        any_of:
          - X.Y.Z
          - stable
          - build workflow
          - GitHub Release
        forbidden:
          - tag-validated-artifact
          - integration-
          - rc.N
      judge_criteria: |
        Score 0-10 based on how completely the tags are described.
        10: Correctly names all three tags — X.Y.Z (stable semver for OCIRepository polling), sha-<7char> (immutable commit reference), validated-<7char> (compatibility tag for live's tag_pattern filter) — and states all are applied by the build workflow at build time. May mention the GitHub Release.
        7-9: Names all three tags but misses which purpose one serves.
        4-6: Knows 2 tags or incorrectly attributes tags to a separate promotion workflow.
        1-3: Describes the old five-tag RC scheme or only 1 tag.
        0: Does not describe the tagging strategy at all.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Lists the three artifact tags — X.Y.Z, sha-<7char>, and validated-<7char> — all created by the build workflow at build time, and explains the purpose of each. No separate promotion workflow adds tags.
    tags:
      - promotion-pipeline-skill

  - id: PRM-03
    description: "Semver constraints per cluster and where they are configured"
    category: coverage
    severity: critical
    prompt: |
      What are the exact semver constraints configured on each cluster's OCIRepository, where is this configured, and do integration and live receive different artifacts?
    scoring:
      mode: both
      keywords:
        required:
          - ">= 0.0.0"
          - live
        any_of:
          - ">= 0.0.0-0"
          - infrastructure/modules/config
          - pre-release
          - same artifacts
      judge_criteria: |
        Score 0-10 on accuracy of semver constraint explanation.
        10: States live uses >= 0.0.0 (stable only) and integration uses >= 0.0.0-0 (would accept pre-releases, but none are built today so both clusters receive the same stable artifacts). Identifies infrastructure/modules/config/main.tf as where constraints are configured, and notes integration is not a validation gate.
        7-9: Correct constraints and location but missing that both clusters now receive the same artifacts.
        4-6: Correct general idea but wrong or missing exact constraint strings.
        1-3: Claims integration receives RC artifacts as a validation stage.
        0: Incorrect or no answer.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Explains that live uses >= 0.0.0 and integration uses >= 0.0.0-0, configured in infrastructure/modules/config/main.tf. Since only stable tags are built, both clusters receive the same artifacts — integration is not a gate.
    tags:
      - promotion-pipeline-skill

  - id: PRM-04
    description: "Debugging live not updating — decision tree"
    category: coverage
    severity: critical
    prompt: |
      A change was merged to main two hours ago and I can see the OCI artifact in GHCR with a stable tag, but the live cluster has not picked it up. Walk me through the debugging steps.
    scoring:
      mode: both
      keywords:
        required:
          - OCIRepository
          - semver
        any_of:
          - ">= 0.0.0"
          - kubectl get ocirepository
          - flux reconcile source oci
          - .status.conditions
          - Kustomization
        forbidden:
          - repository_dispatch
          - validation-success
          - tag-validated-artifact
      judge_criteria: |
        Score 0-10 on actionability and completeness of debugging guidance.
        10: Walks through the decision tree: (1) check live OCIRepository semver constraint is >= 0.0.0 and the new tag is strictly higher than current, (2) check OCIRepository .status.conditions for errors, (3) force reconcile with flux reconcile source oci, (4) check platform Kustomization status for dependency/schema errors, (5) check HelmRelease health blocking rollout. Provides exact commands with --context live.
        7-9: Covers most steps with working commands but missing one branch.
        4-6: General guidance with 2-3 correct steps but incomplete commands.
        1-3: Routes debugging through integration validation or Flux Alerts that no longer exist.
        0: Incorrect.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Follows the live-not-updating decision tree: verifies the stable tag in GHCR is higher than current, checks the live OCIRepository semver constraint and status conditions, force-reconciles the OCI source, then checks Kustomization and HelmRelease health.
    tags:
      - promotion-pipeline-skill

  - id: PRM-05
    description: "Rollback procedure options"
    category: coverage
    severity: high
    prompt: |
      A bad change reached the live cluster. What are my rollback options, from safest to fastest?
    scoring:
      mode: both
      keywords:
        required:
          - revert
        any_of:
          - manual-promote.sh
          - flux tag artifact
          - pin
          - ocirepository
          - higher
      judge_criteria: |
        Score 0-10 on correctness and completeness of the rollback options.
        10: Presents all three options: (1) revert the PR on main (safest — rebuilds through the normal pipeline), (2) re-tag a known-good artifact with a higher stable version (manual-promote.sh or flux tag artifact; new tag must be strictly higher than current), (3) pin the live OCIRepository to a previous tag (immediate, but the pin must be reverted later).
        7-9: Two of the three options with correct mechanics.
        4-6: One correct option, or re-tagging described without the higher-version requirement.
        1-3: Suggests re-running a promotion workflow that no longer exists.
        0: Incorrect.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Recommends reverting the PR as the safest option, describes emergency re-tagging of a known-good sha with a higher stable version (manual-promote.sh), and pinning the OCIRepository tag as an immediate stopgap.
    tags:
      - promotion-pipeline-skill
