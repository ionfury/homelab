version: 1
skill: gha-pipelines
description: "Verify the homelab GHA pipelines skill correctly describes the workflow inventory, tool setup conventions, OCI promotion integration, and anti-patterns."
tests:
  - id: GHA-01
    description: "Workflow inventory — naming all seven workflows and their triggers"
    category: coverage
    severity: high
    prompt: |
      List all the GitHub Actions workflows in this repository, what triggers each one, and what it does.
    scoring:
      mode: both
      keywords:
        required:
          - kubernetes-validate.yaml
          - infrastructure-validate.yaml
          - build-platform-artifact.yaml
        any_of:
          - renovate-validate.yaml
          - renovate.yaml
          - label-sync.yaml
          - check-version-holds.yaml
          - pull_request
          - push to main
        forbidden:
          - tag-validated-artifact
      judge_criteria: |
        Score 0-10 on completeness of workflow inventory.
        10: Names all seven workflows: kubernetes-validate (PR on kubernetes/), infrastructure-validate (PR on infrastructure/), renovate-validate (PR on renovate config), build-platform-artifact (push to main on kubernetes/), check-version-holds (weekly/push/manual), renovate (scheduled hourly), label-sync (scheduled or manual). Describes purpose of each. Does NOT list a tag-validated-artifact workflow (deleted).
        7-9: Names 5-6 workflows with correct triggers and purposes.
        4-6: Names 3-4 core workflows accurately.
        1-3: Only 1-2 workflows mentioned.
        0: Incorrect or no workflow inventory.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Lists all seven workflows with their triggers and purposes. Correctly identifies that build-platform-artifact triggers on push to main when kubernetes/ files change and tags artifacts as stable at build time.
    tags:
      - trimmed-2026-03-22
      - gha-pipelines-skill

  - id: GHA-02
    description: "Tool setup convention — mise over apt-get/brew"
    category: constraint
    severity: high
    prompt: |
      How should CI tools (like kubectl, flux, tofu) be installed in GitHub Actions workflows for this repository? Show me the correct pattern.
    scoring:
      mode: both
      keywords:
        required:
          - jdx/mise-action
          - mise
        any_of:
          - .mise.toml
          - actions/checkout
          - task
          - NEVER apt-get
          - NEVER brew
      judge_criteria: |
        Score 0-10 on correctness of the tool setup pattern.
        10: Shows the three-step pattern (checkout, mise-action, task command), explains that mise reads .mise.toml so CI and local dev use identical versions, and explicitly states apt-get and brew are forbidden.
        7-9: Shows the mise-action pattern correctly but missing the .mise.toml explanation or the prohibition on apt-get/brew.
        4-6: Mentions mise but shows incorrect action syntax or version.
        1-3: Suggests apt-get or brew (anti-pattern) or very vague.
        0: Incorrect.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Shows the canonical three-step pattern: actions/checkout@v7, jdx/mise-action@v4, then task <domain>:validate. Explains that mise reads .mise.toml for version pinning so CI matches local dev. States that apt-get, brew, and hardcoded versions in workflow files are forbidden.
    tags:
      - trimmed-2026-03-22
      - gha-pipelines-skill

  - id: GHA-03
    description: "Path-based trigger convention including workflow file and mise.toml"
    category: coverage
    severity: medium
    prompt: |
      When adding a pull_request trigger for a new validation workflow that validates the kubernetes/ directory, what paths should be listed in the paths filter?
    scoring:
      mode: both
      keywords:
        required:
          - kubernetes/**
          - .mise.toml
        any_of:
          - .github/workflows/kubernetes-validate.yaml
          - .taskfiles/kubernetes
          - workflow_dispatch
      judge_criteria: |
        Score 0-10 on completeness of the paths list.
        10: Lists kubernetes/**, the workflow file itself (.github/workflows/<name>.yaml), .mise.toml, and relevant taskfiles directory. Also includes workflow_dispatch as a trigger.
        7-9: Lists kubernetes/** and at least one of the workflow file or .mise.toml, plus workflow_dispatch.
        4-6: Lists only kubernetes/** without the self-referential paths.
        1-3: Very incomplete or incorrect paths.
        0: Incorrect.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Lists at minimum: kubernetes/**, .github/workflows/kubernetes-validate.yaml (the workflow file itself), .mise.toml, and .taskfiles/kubernetes/**. Also mentions workflow_dispatch as a required additional trigger per the anti-patterns section.
    tags:
      - trimmed-2026-03-22
      - gha-pipelines-skill

  - id: GHA-04
    description: "OCI build integration — stable tagging at build time and semver design"
    category: coverage
    severity: high
    prompt: |
      I'm modifying the build-platform-artifact workflow. What are the key design constraints I need to be aware of, particularly around versioning and how clusters pick up artifacts?
    scoring:
      mode: both
      keywords:
        required:
          - stable
          - semver
        any_of:
          - validated-
          - sha-
          - ">= 0.0.0"
          - GitHub Release
          - bumps patch
        forbidden:
          - tag-validated-artifact
          - repository_dispatch
      judge_criteria: |
        Score 0-10 on accuracy of the design constraint explanation.
        10: Explains that the workflow resolves the next version by querying GHCR for the highest stable X.Y.Z tag and bumping patch, tags the artifact X.Y.Z + sha-<short> + validated-<short> at build time, and creates a GitHub Release. Mentions the direct build-to-live design: live polls >= 0.0.0, integration polls >= 0.0.0-0, both receive the same stable artifacts, and no separate promotion workflow exists.
        7-9: Covers the stable-at-build tagging correctly but missing the semver resolution or Release details.
        4-6: Aware of one of the two main constraints.
        1-3: Describes the old RC/promotion design.
        0: Incorrect.
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Explains that versioning is resolved from GHCR (highest stable tag, patch bump), all tags (X.Y.Z, sha-<short>, validated-<short>) are applied at build time, a GitHub Release is created, and clusters pick up artifacts directly via their semver constraints — there is no separate promotion workflow.
    tags:
      - trimmed-2026-03-22
      - gha-pipelines-skill
